# Coding-harness orchestrator config. Applies to every project repo the
# orchestrator is run against. No per-project overrides in v0.1.

max_attempts: 25
max_wall_minutes: 60
# Per-subprocess retry budget for transient agent failures: rate-limit
# throttling (re-spawn after backoff) and malformed VERDICT trailers
# (resume the same session and nudge the model to re-emit the line).
# Independent of max_attempts — these are recovery from infrastructure
# or output-format glitches, not from anything the model said.
max_agent_retries: 3

# Per-role model selection. Generators do heavy decomposition / synthesis
# work and benefit from Opus 4.7's reasoning + 1M context (the work-orders
# generator in particular reads blueprints + current code in a single
# pass). Reviewers run focused single-rubric judgment and are cheaper on
# Sonnet 4.6. Override either by editing this file; passed to `claude -p`
# via `--model`. Tool-wrappers and per-WO coding execution will use the
# generator model by default once the coding loop lands.
model_generator: claude-opus-4-7[1m]
model_reviewer: claude-sonnet-4-6

mirrors: []        # placeholder; no mirrors are configured yet
